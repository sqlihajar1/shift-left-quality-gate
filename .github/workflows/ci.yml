name: CI Shift-Left Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3. Build project
      - name: Build project
        run: mvn clean compile

      # 4. Run tests (JUnit + Karate)
      - name: Run tests
        run: mvn clean test

      # 5. Generate coverage + verify
      - name: Verify build
        run: mvn verify

      # 6. SonarQube / SonarCloud analysis
      - name: Sonar analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=shift-left-quality-gate \
            -Dsonar.organization=sqlihajar1 \
            -Dsonar.host.url=https://sonarcloud.io

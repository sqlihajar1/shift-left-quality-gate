name: CI Shift-Left Pipeline (Stable)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3. Build project
      - name: Build Maven project
        run: mvn clean compile

      # 4. Start Spring Boot app (background)
      - name: Start Spring Boot app
        run: mvn spring-boot:run > app.log 2>&1 &

      # 5. Wait until API is REALLY ready (IMPORTANT FIX)
      - name: Wait for API startup
        run: |
          echo "Waiting for Spring Boot API..."
          
          for i in {1..40}; do
            echo "Try $i..."
            
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/categories || true)

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "404" ]; then
              echo "API is UP (HTTP $STATUS)"
              exit 0
            fi

            sleep 2
          done

          echo "API failed to start"
          cat app.log
          exit 1

      # 6. Run tests + SonarCloud
      - name: Run tests & SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=shift-left-quality-gate \
          -Dsonar.organization=sqlihajar1

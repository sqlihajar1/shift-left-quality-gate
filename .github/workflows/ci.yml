name: CI Shift-Left Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -s http://localhost:9000/api/system/status | grep -q UP"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # ── 1. BUILD ────────────────────────────────────────────
      - name: Build Maven project
        run: mvn clean compile

      # ── 2. SPRING BOOT ──────────────────────────────────────
      - name: Start Spring Boot app
        run: mvn spring-boot:run > app.log 2>&1 &

      - name: Wait for API health check
        run: |
          echo "Waiting for API..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep UP; then
              echo "API is UP"
              exit 0
            fi
            echo "Not ready yet... attempt $i"
            sleep 2
          done
          echo "API failed to start"
          exit 1

      # ── 3. TESTS ────────────────────────────────────────────
      - name: Run tests (JUnit + Karate) + JaCoCo
        run: mvn verify

      # ── 4. SONARQUBE SETUP ──────────────────────────────────
      - name: Wait for SonarQube to be ready
        run: |
          echo "Waiting for SonarQube..."
          for i in {1..30}; do
            STATUS=$(curl -s http://localhost:9000/api/system/status | grep -o '"status":"[^"]*"' || echo "")
            echo "Status: $STATUS"
            if echo "$STATUS" | grep -q "UP"; then
              echo "SonarQube is UP!"
              exit 0
            fi
            sleep 10
          done
          echo "SonarQube failed to start"
          exit 1

      - name: Configure SonarQube admin password
        run: |
          curl -s -u admin:admin -X POST \
            "http://localhost:9000/api/users/change_password" \
            -d "login=admin&previousPassword=admin&password=HM.chanel%40.3726%3D"
          echo "Password updated"

      - name: Generate SonarQube token
        run: |
          TOKEN=$(curl -s -u "admin:HM.chanel@.3726=" -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-token" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "Token generated"

      - name: Create Quality Gate via API
        run: |
          curl -s -u "admin:HM.chanel@.3726=" -X POST \
            "http://localhost:9000/api/qualitygates/create" \
            -d "name=ShiftLeftGate"

          GATE_ID=$(curl -s -u "admin:HM.chanel@.3726=" \
            "http://localhost:9000/api/qualitygates/list" | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          gates = data['qualitygates']
          gate = next(g for g in gates if g['name'] == 'ShiftLeftGate')
          print(gate.get('uuid') or gate.get('id'))
          ")
          echo "Gate ID: $GATE_ID"
          echo "GATE_ID=$GATE_ID" >> $GITHUB_ENV

          curl -s -u "admin:HM.chanel@.3726=" -X POST \
            "http://localhost:9000/api/qualitygates/create_condition" \
            -d "gateId=$GATE_ID&metric=coverage&op=LT&error=80"

          curl -s -u "admin:HM.chanel@.3726=" -X POST \
            "http://localhost:9000/api/qualitygates/create_condition" \
            -d "gateId=$GATE_ID&metric=security_hotspots_reviewed&op=LT&error=80"

          curl -s -u "admin:HM.chanel@.3726=" -X POST \
            "http://localhost:9000/api/qualitygates/create_condition" \
            -d "gateId=$GATE_ID&metric=duplicated_lines_density&op=GT&error=3"

          curl -s -u "admin:HM.chanel@.3726=" -X POST \
            "http://localhost:9000/api/qualitygates/create_condition" \
            -d "gateId=$GATE_ID&metric=blocker_violations&op=GT&error=0"

      - name: Set Quality Gate as default
        run: |
          curl -s -u "admin:HM.chanel@.3726=" -X POST \
            "http://localhost:9000/api/qualitygates/set_as_default" \
            -d "id=$GATE_ID"

      # ── 5. ANALYSE SONARQUBE ────────────────────────────────
      - name: Run SonarQube analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=shift-left-quality-gate \
            -Dsonar.projectName="Shift-Left Quality Gate" \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token=${{ env.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # ── 6. QUALITY GATE CHECK ───────────────────────────────
      - name: Check Quality Gate result
        run: |
          echo "Waiting for SonarQube to process analysis..."
          sleep 15

          STATUS=$(curl -s -u "admin:HM.chanel@.3726=" \
            "http://localhost:9000/api/qualitygates/project_status?projectKey=shift-left-quality-gate" | \
            python3 -c "
          import sys, json
          result = json.load(sys.stdin)
          status = result['projectStatus']['status']
          print(status)
          ")

          echo "======================================"
          echo "Quality Gate Status : $STATUS"
          echo "======================================"

          if [ "$STATUS" != "OK" ]; then
            echo "Quality Gate FAILED — pipeline bloqué "
            curl -s -u "admin:HM.chanel@.3726=" \
              "http://localhost:9000/api/qualitygates/project_status?projectKey=shift-left-quality-gate" | \
              python3 -c "
          import sys, json
          conditions = json.load(sys.stdin)['projectStatus']['conditions']
          for c in conditions:
              if c['status'] == 'ERROR':
                  print(f'   {c[\"metricKey\"]} : {c.get(\"actualValue\",\"?\")} (seuil: {c[\"errorThreshold\"]})')
          "
            exit 1
          else
            echo "Quality Gate PASSED  — déploiement autorisé"
          fi

name: CI Shift-Left Pipeline (Minimal)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Maven project
        run: mvn clean compile

      # lancer Spring Boot
      - name: Start Spring Boot app
        run: mvn spring-boot:run &

      # attendre que le serveur démarre
      - name: Wait for API startup
        run: sleep 20

      # lancer tests et envoyer à SonarCloud
      - name: Run tests & SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Généré automatiquement par GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Le secret que tu viens d'enregistrer
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=shift-left-quality-gate -Dsonar.organization=sqlihajar1

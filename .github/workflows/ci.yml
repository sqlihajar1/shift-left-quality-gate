name: CI Shift-Left Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Maven project
        run: mvn clean compile

      - name: Start Spring Boot app
        run: |
          # Maven injecte automatiquement l'agent JaCoCo via argLine (prepare-agent)
          mvn spring-boot:run > app.log 2>&1 &

      - name: Wait for API health check
        run: |
          echo "Waiting for API..."
          for i in {1..40}; do
            if curl -s http://localhost:8080/actuator/health | grep -q UP; then
              echo "API is UP"
              exit 0
            fi
            echo "Not ready yet... attempt $i"
            sleep 3
          done
          echo "API failed to start"
          cat app.log
          exit 1

      - name: Run Karate Tests + Dump Coverage + SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B failsafe:integration-test failsafe:verify jacoco:dump jacoco:report \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=sqlihajar1_shift-left-quality-gate \
            -Dsonar.organization=sqlihajar1 \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

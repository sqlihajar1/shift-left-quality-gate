name: CI Shift-Left Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Maven project
        run: mvn clean compile

      - name: Start Spring Boot app
        run: mvn spring-boot:run > app.log 2>&1 &

      - name: Show logs (debug)
        run: sleep 10 && cat app.log || true

      - name: Wait for API health check
        run: |
          echo "Waiting for API..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep UP; then
              echo "API is UP"
              exit 0
            fi
            echo "Not ready yet... attempt $i"
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: Run tests (JUnit + Karate)
        run: mvn test

name: CI Shift-Left Pipeline (Spring Boot + Karate + SonarQube)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3. Build project
      - name: Build Maven project
        run: mvn clean compile

      # 4. Start Spring Boot application
      - name: Start Spring Boot app
        run: |
          mvn spring-boot:run > app.log 2>&1 &
          echo $! > app.pid

      # 5. Wait for API startup (IMPORTANT FIX)
      - name: Wait for API startup
        run: |
          echo "Waiting for Spring Boot..."
          for i in {1..30}; do
            curl --silent --fail http://localhost:8080/actuator/health && echo "API READY" && exit 0
            sleep 5
          done

          echo "API failed to start"
          cat app.log
          exit 1

      # 6. Run tests (Karate + unit tests)
      - name: Run tests
        run: mvn test

      # 7. SonarQube analysis (OPTION LOCAL)
      - name: SonarQube Analysis
        run: mvn sonar:sonar \
          -Dsonar.host.url=http://localhost:9000 \
          -Dsonar.login=admin \
          -Dsonar.password=admin

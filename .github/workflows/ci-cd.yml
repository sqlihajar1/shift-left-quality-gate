name: CI/CD Shift-Left Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-test:
    name: CI - Build, Tests, Coverage and Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Maven project
        run: mvn clean compile

      - name: Resolve JaCoCo agent path
        run: |
          mvn dependency:resolve
          JACOCO_AGENT=$(find ~/.m2 -name "org.jacoco.agent-*-runtime.jar" | head -1)
          echo "JACOCO_AGENT=$JACOCO_AGENT" >> $GITHUB_ENV
          echo "Agent found at: $JACOCO_AGENT"

      - name: Start Spring Boot app with JaCoCo TCP agent
        run: |
          mvn spring-boot:run \
            -Dspring-boot.run.jvmArguments="-javaagent:${JACOCO_AGENT}=output=tcpserver,address=localhost,port=6300" \
            > app.log 2>&1 &

      - name: Wait for API health check
        run: |
          echo "Waiting for API..."
          for i in {1..40}; do
            if curl -s http://localhost:8080/actuator/health | grep -q UP; then
              echo "API is UP"
              exit 0
            fi
            echo "Not ready yet... attempt $i"
            sleep 3
          done
          echo "API failed to start"
          cat app.log
          exit 1

      - name: Wait for JaCoCo TCP port 6300
        run: |
          echo "Waiting for JaCoCo TCP port..."
          for i in {1..20}; do
            if nc -z localhost 6300; then
              echo "JaCoCo TCP port is open"
              exit 0
            fi
            echo "Port not ready... attempt $i"
            sleep 2
          done
          echo "JaCoCo port never opened"
          cat app.log
          exit 1

      - name: Run Karate Tests + Dump Coverage + SonarCloud Quality Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B failsafe:integration-test failsafe:verify jacoco:dump jacoco:report \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=sqlihajar1_shift-left-quality-gate \
            -Dsonar.organization=sqlihajar1 \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload Application Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-logs
          path: app.log

  deploy:
    name: CD - Docker Build, Push and Render Deploy
    runs-on: ubuntu-latest
    needs: build-test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:${{ github.sha }}

      - name: Trigger Render Deployment
        run: |
          echo "Triggering Render deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Render deployment triggered successfully."
